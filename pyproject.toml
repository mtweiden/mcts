[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "mcts-tilers"
version = "0.1.0"
description = "MCTS for quantum circuit tiling"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mathias Weiden" },
]
dependencies = [
    "cffi>=2.0",
    "numpy>=2.4.2",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.maturin]
features = ["python"]
manifest-path = "mcts-tilers/Cargo.toml"
module-name = "mcts_tilers.mcts_tilers"
python-source = "mcts-tilers/python"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true