[package]
name = "mcts-tilers"
version = "0.1.0"
edition = "2024"

[lib]
name = "mcts_tilers"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3", "numpy", "tilers/python"]
test-helpers = []

[dependencies]
mcts-core = { path = "../mcts-core" }
tilers = { path = "../../tilers", default-features = false }
anyhow = "1"
libc = "0.2"
serde_json = "1.0.149"
rand_distr = "0.6.0"
rand = "0.10.0"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
# Used by the handler::boards / handler::unpack hot path (cfg=python).
# rustc-hash matches mcts-core for cache-friendly per-instance maps; rayon
# parallelises the per-instance loop in build_boards_rs.
rustc-hash = "2.1"
rayon = "1.10"

[dependencies.pyo3]
version = "0.28.2"
features = ["extension-module"]
optional = true

[dependencies.numpy]
version = "0.28.0"
optional = true

[dev-dependencies]
tempfile = "3"
